name: 'Deploy to EC2'
description: 'Build the web client on the runner, then deploy it and cloud-services to EC2 over SSH'

inputs:
  ec2_pem_key:
    description: 'EC2 PEM key content for SSH authentication'
    required: true
  ec2_host:
    description: 'EC2 host address'
    required: true
  ec2_user:
    description: 'EC2 SSH user'
    required: true
  repo_base_dir:
    description: 'Base directory on EC2 where cloud-services is located'
    required: false
    default: '/home/ubuntu'
  branch:
    description: 'Git branch to deploy'
    required: false
    default: 'main'
  web_api_base_url:
    description: 'API URL baked into the web-client build; empty means the page origin, which nginx proxies to cloud-services'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # The EC2 instance has too little memory for `vite build`, so the runner builds the bundle.
    - name: Check out web-client
      uses: actions/checkout@v5
      with:
        repository: hyperloop-cornell/web-client
        ref: ${{ inputs.branch }}
        path: .deploy/web-client

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '.deploy/web-client/package-lock.json'

    - name: Build web-client
      shell: bash
      working-directory: .deploy/web-client
      env:
        WEB_API_BASE_URL: ${{ inputs.web_api_base_url }}
      run: |
        # Set even when empty so it overrides web-client/.env.production
        export VITE_API_BASE_URL="$WEB_API_BASE_URL"
        npm ci
        npm run build
        tar -czf "$RUNNER_TEMP/web-client-dist.tgz" -C dist .

    - name: Configure SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ec2_pem_key }}" > ~/.ssh/ec2_deploy.pem
        chmod 600 ~/.ssh/ec2_deploy.pem
        cat >> ~/.ssh/config << EOF
        Host ec2-deploy
          HostName ${{ inputs.ec2_host }}
          User ${{ inputs.ec2_user }}
          IdentityFile ~/.ssh/ec2_deploy.pem
          StrictHostKeyChecking no
        EOF

    - name: Upload web-client build and nginx config
      shell: bash
      run: scp "$RUNNER_TEMP/web-client-dist.tgz" "$GITHUB_WORKSPACE/deploy/nginx/hyperloop-gui.conf" ec2-deploy:/tmp/

    - name: Deploy to EC2
      shell: bash
      run: |
        ssh ec2-deploy << 'DEPLOY_EOF'
          set -e
          
          BASE_DIR="${{ inputs.repo_base_dir }}"
          BRANCH="${{ inputs.branch }}"
          
          # Deploy Web Client: nginx serves the build and proxies the API (deploy/nginx/hyperloop-gui.conf)
          echo "Deploying web-client..."
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q nginx
            # The stock site listens on :80, which this deployment does not use
            sudo rm -f /etc/nginx/sites-enabled/default
          fi

          WEB_ROOT=/var/www/hyperloop-gui
          sudo rm -rf "$WEB_ROOT.new" "$WEB_ROOT.old"
          sudo mkdir -p "$WEB_ROOT.new"
          sudo tar -xzf /tmp/web-client-dist.tgz --no-same-owner -C "$WEB_ROOT.new"
          if [ -d "$WEB_ROOT" ]; then sudo mv "$WEB_ROOT" "$WEB_ROOT.old"; fi
          sudo mv "$WEB_ROOT.new" "$WEB_ROOT"
          sudo rm -rf "$WEB_ROOT.old"
          rm -f /tmp/web-client-dist.tgz

          sudo install -m 644 /tmp/hyperloop-gui.conf /etc/nginx/sites-available/hyperloop-gui
          sudo ln -sfn /etc/nginx/sites-available/hyperloop-gui /etc/nginx/sites-enabled/hyperloop-gui
          rm -f /tmp/hyperloop-gui.conf
          sudo nginx -t

          # nginx takes over port 4173 from the old `vite preview` service
          if systemctl cat frontend >/dev/null 2>&1; then
            sudo systemctl disable --now frontend
          fi
          sudo systemctl enable nginx
          sudo systemctl reload-or-restart nginx

          # Deploy Cloud Services API with venv
          echo "Deploying cloud-services..."
          cd "$BASE_DIR/cloud-services"
          
          # Update repository
          git fetch origin
          git checkout "$BRANCH"
          git pull origin "$BRANCH"
          
          # Create venv if it doesn't exist
          if [ ! -d "venv" ]; then
            echo "Creating virtual environment..."
            python3 -m venv venv
          fi
          
          # Activate venv and install dependencies
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          deactivate
          
          # Restart backend service
          echo "Restarting backend service..."
          sudo systemctl restart backend
          
          echo "✅ Deployment completed successfully!"
        DEPLOY_EOF
