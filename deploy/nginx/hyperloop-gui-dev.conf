# Dev slot: serves the web-client built from the latest merged test/* branch and proxies
# the dev cloud-services instance (backend-dev, 127.0.0.1:8081) on the same origin.
# Mirrors hyperloop-gui.conf; only the port, web root and upstream differ.
# The deploy-dev-to-ec2 action installs this as /etc/nginx/sites-available/hyperloop-gui-dev.

map $http_upgrade $hyperloop_dev_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 4174;
    server_name _;

    root /var/www/hyperloop-gui-dev;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $hyperloop_dev_connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location /auth/    { proxy_pass http://127.0.0.1:8081; }
    location /api/     { proxy_pass http://127.0.0.1:8081; }
    location /ws/      { proxy_pass http://127.0.0.1:8081; }
    location = /hub    { proxy_pass http://127.0.0.1:8081; }
    location = /health { proxy_pass http://127.0.0.1:8081; }

    # Which branch and commits are deployed here
    location = /deploy-info.txt {
        add_header Cache-Control "no-cache";
        default_type text/plain;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
