# Serves the web-client build and proxies cloud-services on the same origin, so the
# browser needs no CORS and port 8080 does not have to be reachable from the internet.
# The deploy action installs this as /etc/nginx/sites-available/hyperloop-gui.

map $http_upgrade $hyperloop_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 4173;
    server_name _;

    root /var/www/hyperloop-gui;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Flash requests carry the firmware base64-encoded in the JSON body
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $hyperloop_connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Hub and browser websockets can sit idle between messages
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location /auth/    { proxy_pass http://127.0.0.1:8080; }
    location /api/     { proxy_pass http://127.0.0.1:8080; }
    location /ws/      { proxy_pass http://127.0.0.1:8080; }
    location = /hub    { proxy_pass http://127.0.0.1:8080; }
    location = /health { proxy_pass http://127.0.0.1:8080; }

    # File names under /assets/ change with their content on every build
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/devices, /telemetry, ...) load the app shell
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
